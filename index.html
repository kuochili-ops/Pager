<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call - MediaRecorder 錄影版</title>

<style>
/* ====== BB Call 外框 ====== */
.pager {
    width: 360px;
    height: 230px;
    border-radius: 18px;
    background: #111;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    padding: 0;
    position: relative;
    margin-top: 20px;
}

/* ====== 錄影完成彈窗 ====== */
#download-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}

.overlay-box {
    background: #111;
    padding: 20px 30px;
    border-radius: 12px;
    color: #fff;
    text-align: center;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.overlay-box button {
    margin-top: 12px;
    padding: 10px 20px;
    background: #ff5722;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 16px;
}

/* ====== 錄影中按鈕閃爍 ====== */
#recordBtn.recording {
    background: #ff1744;
    animation: blinkRecord 0.8s infinite;
}

@keyframes blinkRecord {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

/* ====== 輸入區 ====== */
.input-area {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

textarea {
    width: 260px;
    height: 120px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #eee;
    font-size: 16px;
    resize: none;
    white-space: pre-wrap;
}

button {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: #4caf50;
    color: #fff;
    font-size: 15px;
}

#shareBtn { background: #2196f3; }
#recordBtn { background: #ff9800; }
</style>
</head>

<body>

<!-- ====== 輸入區 ====== -->
<div class="input-area">
  <textarea id="msgInput" placeholder="輸入訊息（Enter 換行）"></textarea>
  <button id="sendBtn">送出</button>
  <button id="shareBtn">分享</button>
  <button id="recordBtn">🔴 錄製製作</button>
</div>

<!-- ====== BB Call 裝置（Canvas） ====== -->
<div class="pager" id="pager">
  <canvas id="bbCanvas" width="360" height="230"></canvas>
</div>

<!-- ====== 錄影完成彈窗 ====== -->
<div id="download-overlay">
    <div class="overlay-box">
        <h2>✨ 錄製完成！</h2>
        <p>影片已自動下載，如未成功請點擊下方按鈕。</p>
        <button id="manualDownloadBtn2">下載影片</button>
    </div>
</div>

<!-- ====== JS（下一段會補上） ====== -->
<script>
/* ==========================================
   📟 BB Call 畫面渲染（Canvas）
========================================== */
const canvas = document.getElementById("bbCanvas");
const ctx = canvas.getContext("2d");

let carouselLines = [];      // 要播放的文字
let currentLineIndex = 0;
let frameDuration = 1200;    // 每行停留時間（毫秒）

function renderLine(text) {
    // 背景
    ctx.fillStyle = "#021a02";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 文字
    ctx.fillStyle = "#b9ffb9";
    ctx.font = "32px monospace";
    ctx.fillText(text, 20, 120);
}

/* ==========================================
   🎥 MediaRecorder 錄影模組
========================================== */
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;

function startAutoRecording() {
    if (isRecording) return;

    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;

    carouselLines = msg.split("\n");
    currentLineIndex = 0;
    recordedChunks = [];

    // 從 Canvas 擷取串流
    const stream = canvas.captureStream(30);

    const options = { 
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 8000000
    };

    try {
        mediaRecorder = new MediaRecorder(stream, options);
    } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = exportVideo;

    mediaRecorder.start();
    isRecording = true;

    // UI：按鈕變紅閃爍
    const recordBtn = document.getElementById("recordBtn");
    recordBtn.classList.add("recording");
    recordBtn.innerText = "錄製製作中";

    startCarousel();
}

function stopRecording() {
    if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;

        const recordBtn = document.getElementById("recordBtn");
        recordBtn.classList.remove("recording");
        recordBtn.innerText = "🔴 錄製製作";
    }
}

function exportVideo() {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);

    // 自動下載
    const a = document.createElement("a");
    a.href = url;
    a.download = `BBCall_${Date.now()}.webm`;
    a.click();

    // 手動下載備用
    document.getElementById("manualDownloadBtn2").onclick = () => a.click();

    // 顯示彈窗
    document.getElementById("download-overlay").style.display = "flex";
}

/* ==========================================
   🌀 文字輪播（含自動停止錄影）
========================================== */
function startCarousel() {
    const totalLines = carouselLines.length;

    function nextFrame() {
        if (currentLineIndex >= totalLines) {
            stopRecording();   // ← 錄影一定會停止
            return;
        }

        renderLine(carouselLines[currentLineIndex]);
        currentLineIndex++;

        setTimeout(nextFrame, frameDuration);
    }

    nextFrame();
}

/* ==========================================
   🔘 按鈕綁定
========================================== */
document.getElementById("recordBtn").onclick = startAutoRecording;

document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    carouselLines = msg.split("\n");
    currentLineIndex = 0;
    renderLine(carouselLines[0]);
};
</script>

</body>
</html>
