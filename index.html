<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call - 錄影整合版</title>

<!-- html2canvas：把 BB Call 畫面轉成 Canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ====== BB Call 外殼（美化後） ====== */
body {
    background: #0d0d0d;
    color: #eee;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

textarea {
    width: 260px;
    height: 120px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #eee;
    font-size: 16px;
    resize: none;
}

button {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: #4caf50;
    color: #fff;
    font-size: 15px;
}

#shareBtn { background: #2196f3; }
#recordBtn { background: #ff9800; }

.pager {
    width: 360px;
    height: 230px;
    border-radius: 22px;
    background: linear-gradient(145deg, #1b1b1b, #2d2d2d);
    box-shadow:
        inset 0 0 10px #000,
        0 0 0 3px #444,
        0 12px 25px rgba(0,0,0,0.7),
        0 0 25px rgba(0,255,0,0.15);
    padding: 14px;
    position: relative;
    overflow: hidden;
    border: 1px solid #222;
}

/* ====== 螢幕 ====== */
.screen {
    background: #021a02;
    border-radius: 8px;
    border: 3px solid #0f3d0f;
    height: 130px;
    position: relative;
    overflow: hidden;
    box-shadow:
        inset 0 0 10px #000,
        0 0 10px rgba(0,255,0,0.2);
}

/* ====== REC 紅點 ====== */
.rec-indicator {
    position: absolute;
    top: 4px;
    left: 8px;
    font-size: 12px;
    font-weight: bold;
    color: #ff3b3b;
    text-shadow: 0 0 4px #ff3b3b;
    opacity: 0;
}

.rec-on {
    animation: recBlink 0.8s infinite;
}

@keyframes recBlink {
    0% { opacity: 1; }
    50% { opacity: 0.2; }
    100% { opacity: 1; }
}

/* ====== 訊息區 ====== */
.message-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.pixel {
    font-size: 44px;
    line-height: 44px;
    color: #b9ffb9;
    text-shadow: 0 0 6px #b9ffb9;
}

/* ====== 錄影完成彈窗 ====== */
#recordDoneBox {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    padding: 18px 26px;
    border-radius: 12px;
    color: #fff;
    font-size: 17px;
    text-align: center;
    display: none;
    z-index: 99999;
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

#downloadBtn {
    margin-top: 10px;
    padding: 10px 16px;
    background: #ff5722;
    border-radius: 6px;
    color: #fff;
    border: none;
    font-size: 15px;
}
</style>
</head>

<body>

<!-- ====== 輸入區 ====== -->
<div class="input-area">
  <textarea id="msgInput" placeholder="輸入訊息（Enter 換行）"></textarea>
  <button id="sendBtn">送出</button>
  <button id="shareBtn">分享</button>
  <button id="recordBtn">🔴 錄影</button>
</div>

<!-- ====== BB Call 裝置 ====== -->
<div class="pager" id="pager">
  <div class="screen" id="screen">
      <div class="rec-indicator" id="recDot">REC ●</div>
      <div class="message-area" id="messageArea"></div>
  </div>
  <div class="brand">𓃥 白六 Call</div>
</div>

<!-- ====== 錄影完成彈窗 ====== -->
<div id="recordDoneBox">
  <div>🎉 錄影完成！</div>
  <button id="downloadBtn">下載影片</button>
</div>

<script>
/* ==========================================
   🟩 BB Call 逐行 + 跑馬燈顯示（原本規則）
========================================== */
let lines = [];
let index = 0;

function showLine() {
    if (index >= lines.length) {
        stopRecording();
        return;
    }

    const area = document.getElementById("messageArea");
    area.innerHTML = "";

    const line = document.createElement("div");
    line.className = "pixel";
    line.style.position = "absolute";
    line.style.top = "55px";
    line.style.left = "10px";
    line.style.whiteSpace = "nowrap";
    line.textContent = lines[index];

    area.appendChild(line);

    const areaWidth = area.clientWidth;
    const textWidth = line.scrollWidth;

    setTimeout(() => {
        if (textWidth > areaWidth) {
            const overflow = textWidth - areaWidth + 30;
            const duration = Math.max(1.5, overflow / 40);

            line.style.transition = `transform ${duration}s linear`;
            line.style.transform = `translateX(-${overflow}px)`;

            setTimeout(() => {
                index++;
                showLine();
            }, duration * 1000 + 1000);

        } else {
            setTimeout(() => {
                index++;
                showLine();
            }, 1800);
        }
    }, 500);
}

/* ==========================================
   🎥 MediaRecorder 錄影整合
========================================== */
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;

async function startRecording() {
    if (isRecording) return;

    recordedChunks = [];

    const pager = document.getElementById("pager");

    const canvas = await html2canvas(pager);
    const stream = canvas.captureStream(30);

    mediaRecorder = new MediaRecorder(stream, {
        mimeType: "video/webm;codecs=vp9"
    });

    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = exportVideo;

    mediaRecorder.start();
    isRecording = true;

    document.getElementById("recDot").classList.add("rec-on");
}

function stopRecording() {
    if (!isRecording) return;
    mediaRecorder.stop();
    isRecording = false;

    document.getElementById("recDot").classList.remove("rec-on");
}

function exportVideo() {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `bbcall_${Date.now()}.webm`;
    a.click();

    document.getElementById("recordDoneBox").style.display = "block";

    document.getElementById("downloadBtn").onclick = () => {
        const a2 = document.createElement("a");
        a2.href = url;
        a2.download = `bbcall_${Date.now()}.webm`;
        a2.click();
    };
}

/* ==========================================
   🔘 按鈕綁定
========================================== */
document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    showLine();
};

document.getElementById("recordBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;

    lines = msg.split("\n");
    index = 0;

    startRecording();
    showLine();
};
</script>

</body>
</html>
