<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call – 正面按鍵 + 分享鍵 + 白名牌版</title>

<style>
body {
    background:#0d0d0d; color:#eee; font-family:"Courier New", monospace;
    display:flex; flex-direction:column; align-items:center; margin:0; padding-top:20px;
}

/* ====== 輸入區 ====== */
.input-area { display:flex; gap:10px; margin-bottom:20px; }
textarea {
    width:240px; height:120px; background:#1a1a1a; color:#eee;
    border:1px solid #555; border-radius:6px; padding:10px; resize:none;
}
button {
    padding:10px 12px; border:none; border-radius:6px;
    color:#fff; background:#4caf50; cursor:pointer;
}

/* ====== 分享鍵 ====== */
.share-btn {
    background:#2196f3;
}

/* ====== 機身 ====== */
.pager {
    width:360px; height:300px;
    background:#1b1b1b;
    border-radius:20px;
    padding:14px;
    box-sizing:border-box;
    position:relative;
    box-shadow:
        inset 0 0 10px #000,
        0 0 0 3px #444,
        0 0 20px #000;
    transition:transform 0.1s;
}

/* ====== 正面按鍵區 ====== */
.front-buttons {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    display:flex;
    justify-content:space-between;
}

.btn-front {
    width:32px;
    height:32px;
    background:#2a2a2a;
    border-radius:50%;
    box-shadow:
        0 0 4px #000,
        inset 0 0 6px #555;
    transition:0.1s;
}

.btn-front:active {
    transform:scale(0.92);
    box-shadow:
        0 0 2px #000,
        inset 0 0 3px #777;
}

/* ====== 分享鍵（放在按鍵區右側） ====== */
.share-front {
    width:60px;
    height:32px;
    background:#2196f3;
    border-radius:8px;
    color:white;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 4px #000, inset 0 0 4px #555;
    cursor:pointer;
}

/* ====== 顯示區 ====== */
.screen {
    width:100%;
    height:140px;
    background:#021a02;
    border:3px solid #0f3d0f;
    border-radius:8px;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 0 12px #000;
}

/* ====== 顯示區內狀態列 ====== */
.status-inside {
    position:absolute;
    top:2px;
    left:0;
    width:100%;
    height:20px;
    color:#7aff7a;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    font-weight:bold;
    pointer-events:none;
}

/* ====== 顯示區外沿名牌（白色） ====== */
.nameplate {
    position:absolute;
    bottom:-22px;
    left:10px;
    color:#ffffff;
    font-size:14px;
    opacity:0.95;
    text-shadow:0 0 4px #fff;
}

/* ====== 機殼名牌（白色） ====== */
.shell-nameplate {
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    opacity:0.95;
    text-shadow:0 0 4px #fff;
}

#screenCanvas {
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* ====== 來訊震動 ====== */
.pager.shake {
    animation: shake 0.3s ease;
}
@keyframes shake {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(-3px); }
    50%  { transform: translateX(3px); }
    75%  { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="input-area">
  <textarea id="msgInput"></textarea>
  <button id="sendBtn">送出</button>
  <button class="share-btn" id="shareBtn">分享</button>
</div>

<div class="pager">

  <!-- 機殼名牌（白色） -->
  <div class="shell-nameplate">𓃥 白六 CALL</div>

  <div class="screen">

    <!-- 顯示區內狀態列 -->
    <div class="status-inside">
        <div>SIG ▂▄▆█</div>
        <div>VIB ≈≈   MSG ✉</div>
        <div>BAT [▮▮▯]</div>
    </div>

    <canvas id="screenCanvas" width="360" height="140"></canvas>

    <!-- 顯示區外沿名牌（白色） -->
    <div class="nameplate">𓃥 白六 CALL</div>
  </div>

  <!-- ⭐ 正面按鍵區 -->
  <div class="front-buttons">
      <div class="btn-front"></div>
      <div class="btn-front"></div>
      <div class="btn-front"></div>
      <div class="btn-front"></div>

      <div class="share-front" id="shareFrontBtn">分享</div>
  </div>

</div>

<script>
/* ===== Canvas 初始化 ===== */
const canvas = document.getElementById("screenCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

ctx.font = "44px Courier New";
ctx.fillStyle = "#b9ffb9";
ctx.textBaseline = "top";
ctx.shadowColor = "#b9ffb9";
ctx.shadowBlur = 6;

/* ===== BB Call 節奏 ===== */
const HOLD = 120;
const SLIDE_SPEED = 0.08;
const MARQUEE_DELAY = 30;
const MARQUEE_SPEED = 0.6;

/* ===== 狀態 ===== */
let lines = [];
let index = 0;
let currentText = "";
let scrollX = 10;

let marqueeDelay = 0;
let marqueeFinished = false;
let marqueeHold = 0;

let slidingIn = false;
let slidingOut = false;

let slideInProgress = 0;
let slideOutProgress = 0;

/* ===== 主畫面繪製 ===== */
function drawScreen() {
    ctx.clearRect(0,0,W,H);

    let y = 50; // 避開狀態列

    if (slidingIn) y += (1 - slideInProgress) * 40;
    if (slidingOut) y -= slideOutProgress * 40;

    ctx.fillText(currentText, scrollX, y);
}

/* ===== 動畫主迴圈 ===== */
function animate() {
    requestAnimationFrame(animate);

    if (!slidingIn && !slidingOut && slideInProgress === 1 && slideOutProgress === 0) {

        const w = ctx.measureText(currentText).width;

        if (w <= W - 20 && !marqueeFinished) {
            marqueeFinished = true;
            marqueeHold = 60;
        }

        if (marqueeFinished) {
            if (marqueeHold > 0) {
                marqueeHold--;
                drawScreen();
                return;
            } else {

                if (index === lines.length - 1) {
                    return;
                }

                slidingOut = true;
                slideOutProgress = 0;
                marqueeFinished = false;
                requestAnimationFrame(slideOutStep);
                return;
            }
        }

        if (marqueeDelay > 0) marqueeDelay--;
        else {
            if (w > W - 20) {
                scrollX -= MARQUEE_SPEED;

                if (scrollX < -(w - (W - 20))) {
                    marqueeFinished = true;
                    marqueeHold = 60;
                }
            }
        }
    }

    drawScreen();
}
animate();

/* ===== 顯示下一行 ===== */
function showLine() {
    if (index >= lines.length) return;

    currentText = lines[index];
    scrollX = 10;

    marqueeDelay = MARQUEE_DELAY;
    marqueeFinished = false;
    marqueeHold = 0;

    slidingIn = true;
    slidingOut = false;

    slideInProgress = 0;
    slideOutProgress = 0;

    /* ⭐ 來訊震動 */
    const pager = document.querySelector(".pager");
    pager.classList.add("shake");
    setTimeout(() => pager.classList.remove("shake"), 300);

    requestAnimationFrame(slideInStep);
}

function slideInStep() {
    slideInProgress += SLIDE_SPEED;

    if (slideInProgress >= 1) {
        slidingIn = false;
        slideInProgress = 1;
    } else requestAnimationFrame(slideInStep);
}

function slideOutStep() {
    slideOutProgress += SLIDE_SPEED;

    if (slideOutProgress >= 1) {
        slidingOut = false;
        slideOutProgress = 1;

        index++;

        if (index < lines.length) {
            showLine();
        }

    } else requestAnimationFrame(slideOutStep);
}

/* ===== 分享鍵（上方） ===== */
document.getElementById("shareBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    const url = location.href.split("?")[0];
    const shareText = `${url}?msg=${encodeURIComponent(msg)}`;

    navigator.clipboard.writeText(shareText);
    alert("已複製分享連結！");
};

/* ===== 分享鍵（正面按鍵區） ===== */
document.getElementById("shareFrontBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    const url = location.href.split("?")[0];
    const shareText = `${url}?msg=${encodeURIComponent(msg)}`;

    navigator.clipboard.writeText(shareText);
    alert("已複製分享連結！");
};

/* ===== 送出 ===== */
document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    showLine();
};
</script>

</body>
</html>
