<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call – 可換行穩定版</title>

<style>
body {
    background:#0d0d0d; color:#eee; font-family:"Courier New", monospace;
    display:flex; flex-direction:column; align-items:center; margin:0; padding-top:20px;
}
.input-area { display:flex; gap:10px; margin-bottom:20px; }
textarea {
    width:240px; height:120px; background:#1a1a1a; color:#eee;
    border:1px solid #555; border-radius:6px; padding:10px; resize:none;
}
button { padding:10px 12px; border:none; border-radius:6px; color:#fff; background:#4caf50; }

.pager {
    width:360px; height:260px; background:#1b1b1b; border-radius:20px;
    padding:14px; box-sizing:border-box; position:relative;
    box-shadow:inset 0 0 10px #000, 0 0 0 3px #444;
}

.screen {
    width:100%;
    height:140px;
    background:#021a02;
    border:3px solid #0f3d0f;
    border-radius:8px;
    position:relative;
    overflow:hidden;
}

#screenCanvas {
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}
</style>
</head>

<body>

<div class="input-area">
  <textarea id="msgInput"></textarea>
  <button id="sendBtn">送出</button>
</div>

<div class="pager">
  <div class="screen">
    <canvas id="screenCanvas" width="360" height="140"></canvas>
  </div>
</div>

<script>
/* ===== Canvas 初始化 ===== */
const canvas = document.getElementById("screenCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

ctx.font = "44px Courier New";
ctx.fillStyle = "#b9ffb9";
ctx.textBaseline = "top";
ctx.shadowColor = "#b9ffb9";
ctx.shadowBlur = 6;

/* ===== BB Call 節奏 ===== */
const HOLD = 120;              // 停留 2 秒
const SLIDE_SPEED = 0.08;
const MARQUEE_DELAY = 30;      // 跑馬燈延遲 0.5 秒
const MARQUEE_SPEED = 0.6;

/* ===== 狀態 ===== */
let lines = [];
let index = 0;
let currentText = "";
let scrollX = 10;

let marqueeDelay = 0;
let marqueeFinished = false;
let marqueeHold = 0;

let slidingIn = false;
let slidingOut = false;

let slideInProgress = 0;
let slideOutProgress = 0;

/* ===== 主畫面繪製 ===== */
function drawScreen() {
    ctx.clearRect(0,0,W,H);

    let y = 40;

    if (slidingIn) y += (1 - slideInProgress) * 40;
    if (slidingOut) y -= slideOutProgress * 40;

    ctx.fillText(currentText, scrollX, y);
}

/* ===== 動畫主迴圈 ===== */
function animate() {
    requestAnimationFrame(animate);

    // ⭐ 跑馬燈只在完全靜止時啟動
    if (!slidingIn && !slidingOut && slideInProgress === 1 && slideOutProgress === 0) {

        // ⭐ 跑馬燈跑完後停 1 秒
        if (marqueeFinished) {
            if (marqueeHold > 0) {
                marqueeHold--;
                drawScreen();
                return;
            } else {
                // ⭐ 停 1 秒後 → 直接滑出（保證換行）
                slidingOut = true;
                slideOutProgress = 0;
                marqueeFinished = false;
                requestAnimationFrame(slideOutStep);
                return;
            }
        }

        // ⭐ 跑馬燈延遲
        if (marqueeDelay > 0) marqueeDelay--;
        else {
            const w = ctx.measureText(currentText).width;

            if (w > W - 20) {
                scrollX -= MARQUEE_SPEED;

                // ⭐ 跑馬燈跑完 → 停 1 秒
                if (scrollX < -(w - (W - 20))) {
                    marqueeFinished = true;
                    marqueeHold = 60;   // 停 1 秒
                }
            }
        }
    }

    drawScreen();
}
animate();

/* ===== 顯示下一行 ===== */
function showLine() {
    if (index >= lines.length) return;

    currentText = lines[index];
    scrollX = 10;

    marqueeDelay = MARQUEE_DELAY;
    marqueeFinished = false;
    marqueeHold = 0;

    slidingIn = true;
    slidingOut = false;

    slideInProgress = 0;
    slideOutProgress = 0;

    requestAnimationFrame(slideInStep);
}

function slideInStep() {
    slideInProgress += SLIDE_SPEED;

    if (slideInProgress >= 1) {
        slidingIn = false;
        slideInProgress = 1;
        // ⭐ 滑入完成後 → 等跑馬燈
    } else requestAnimationFrame(slideInStep);
}

function slideOutStep() {
    slideOutProgress += SLIDE_SPEED;

    if (slideOutProgress >= 1) {
        slidingOut = false;
        slideOutProgress = 1;
        index++;
        showLine();   // ⭐ 換行一定會發生
    } else requestAnimationFrame(slideOutStep);
}

/* ===== 按鈕 ===== */
document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    showLine();
};
</script>

</body>
</html>
