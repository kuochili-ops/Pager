<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call – 全畫布高畫質錄影版</title>

<style>
body {
    background:#0d0d0d; color:#eee; font-family:"Courier New", monospace;
    display:flex; flex-direction:column; align-items:center; margin:0; padding-top:20px;
}

/* ====== 輸入區 ====== */
.input-area { display:flex; gap:10px; margin-bottom:20px; }
textarea {
    width:240px; height:120px; background:#1a1a1a; color:#eee;
    border:1px solid #555; border-radius:6px; padding:10px; resize:none;
}
button {
    padding:10px 12px; border:none; border-radius:6px;
    color:#fff; background:#4caf50; cursor:pointer;
}
.share-btn { background:#2196f3; }

/* ====== 顯示與錄影 Canvas ====== */
.canvas-container {
    position: relative;
    width: 500px;
    height: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#screenCanvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #0d0d0d;
}

/* ====== 錄影狀態提示燈 ====== */
.rec-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 0, 0, 0.8);
    color: white;
    padding: 8px 12px;
    border-radius: 4px;
    font-weight: bold;
    display: none;
    animation: blink 1s infinite;
    z-index: 999;
}
@keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>

<body>

<div id="recIndicator" class="rec-indicator">● REC AUTOMATIC</div>

<div class="input-area">
  <textarea id="msgInput"></textarea>
  <button id="sendBtn">送出並錄影</button>
  <button class="share-btn" id="shareBtn">分享連結</button>
</div>

<div class="canvas-container">
    <canvas id="screenCanvas" width="1080" height="1080"></canvas>
</div>

<script>
/* ===== Canvas 初始化 ===== */
const canvas = document.getElementById("screenCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

/* ===== BB Call 動態參數 (基於 1080p 等比放大) ===== */
const SLIDE_SPEED = 0.08;
const MARQUEE_DELAY = 30;
const MARQUEE_SPEED = 5.0; // 加快滾動速度契合大解析度

/* ===== 狀態變數 ===== */
let lines = [];
let index = 0;
let currentText = "";
let scrollX = 210; // 文字滾動起始 X 座標（對應綠色螢幕內部）

let marqueeDelay = 0;
let marqueeFinished = false;
let marqueeHold = 0;

let slidingIn = false;
let slidingOut = false;
let slideInProgress = 0;
let slideOutProgress = 0;

// 機身震動效果變數
let shakeOffset = { x: 0, y: 0 };
let isShaking = false;
let shakeTimer = 0;

/* ===== 🎦 錄影相關變數 ===== */
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;

/* ===== 核心繪製邏輯：把機身、螢幕、文字全畫進去 ===== */
function renderAll() {
    ctx.clearRect(0, 0, W, H);
    
    ctx.save();
    // 應用來訊震動偏移
    if (isShaking) {
        ctx.translate(shakeOffset.x, shakeOffset.y);
    }

    // 1. 繪製 Pager 機身外殼 (外圍大黑色圓角矩形)
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 40;
    ctx.fillStyle = "#1b1b1b";
    drawRoundedRect(ctx, 140, 190, 800, 700, 50); 
    ctx.shadowBlur = 0; // 關閉陰影防重疊

    // 機身外殼邊框線
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 8;
    ctx.stroke();

    // 2. 繪製機殼名牌「𓃥 白六 CALL」
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 42px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 10;
    ctx.fillText("𓃥 白六 CALL", 540, 720);
    ctx.shadowBlur = 0;

    // 3. 繪製綠色螢幕外框與內域
    // 外框
    ctx.strokeStyle = "#0f3d0f";
    ctx.lineWidth = 8;
    ctx.fillStyle = "#021a02";
    drawRoundedRect(ctx, 180, 230, 720, 360, 20);
    ctx.stroke();

    // 4. 繪製螢幕內狀態列 (SIG, VIB, BAT)
    ctx.fillStyle = "#7aff7a";
    ctx.font = "bold 32px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.fillText("SIG ▂▄▆█", 210, 255);
    ctx.textAlign = "center";
    ctx.fillText("VIB ≈≈   MSG ✉", 540, 255);
    ctx.textAlign = "right";
    ctx.fillText("BAT [▮▮▯]", 870, 255);

    // 5. 繪製滾動文字 (裁剪範圍，防止字體超出綠色螢幕框)
    ctx.save();
    // 建立剪裁區域 (限縮在螢幕內)
    ctx.beginPath();
    ctx.rect(200, 300, 680, 260);
    ctx.clip();

    // 設定霓虹綠文字發光
    ctx.fillStyle = "#b9ffb9";
    ctx.font = "110px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.shadowColor = "#b9ffb9";
    ctx.shadowBlur = 20;

    // 計算上下滑動動畫 Y 軸位置
    let textY = 380; 
    if (slidingIn) textY += (1 - slideInProgress) * 120;
    if (slidingOut) textY -= slideOutProgress * 120;

    ctx.fillText(currentText, scrollX, textY);
    ctx.restore(); // 解除裁剪

    // 6. 繪製螢幕下沿外邊名牌
    ctx.fillStyle = "#ffffff";
    ctx.font = "32px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 8;
    ctx.fillText("𓃥 白六 CALL", 200, 625);
    ctx.shadowBlur = 0;

    // 7. 繪製正面按鍵區 (4個圓形按鍵 + 1個長方形分享鍵)
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    // 4 個圓形按鍵
    const btnY = 820;
    const btnXPositions = [260, 360, 460, 560];
    ctx.fillStyle = "#2a2a2a";
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 4;
    btnXPositions.forEach(bx => {
        ctx.beginPath();
        ctx.arc(bx, btnY, 36, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    });

    // 藍色分享按鍵
    ctx.fillStyle = "#2196f3";
    ctx.strokeStyle = "#1976d2";
    drawRoundedRect(ctx, 680, btnY - 36, 160, 72, 16);
    ctx.fill();
    ctx.stroke();
    
    // 分享鍵文字
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 32px sans-serif";
    ctx.fillText("分享", 760, btnY + 4);

    ctx.restore();
}

// 圓角矩形輔助函式
function drawRoundedRect(cx, x, y, width, height, radius) {
    cx.beginPath();
    cx.moveTo(x + radius, y);
    cx.lineTo(x + width - radius, y);
    cx.quadraticCurveTo(x + width, y, x + width, y + radius);
    cx.lineTo(x + width, y + height - radius);
    cx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    cx.lineTo(x + radius, y + height);
    cx.quadraticCurveTo(x, y + height, x, y + height - radius);
    cx.lineTo(x, y + radius);
    cx.quadraticCurveTo(x, y, x + radius, y);
    cx.closePath();
}

/* ===== 震動動畫邏輯 ===== */
function triggerShake() {
    isShaking = true;
    shakeTimer = 18; // 震動持續影格數
}

function updateShake() {
    if (!isShaking) return;
    if (shakeTimer > 0) {
        // 隨機產生 -8 到 8 像素的位移
        shakeOffset.x = (Math.random() - 0.5) * 16;
        shakeOffset.y = (Math.random() - 0.5) * 16;
        shakeTimer--;
    } else {
        isShaking = false;
        shakeOffset = { x: 0, y: 0 };
    }
}

/* ===== 動畫主迴圈 ===== */
function animate() {
    requestAnimationFrame(animate);
    updateShake();

    if (!slidingIn && !slidingOut && slideInProgress === 1 && slideOutProgress === 0) {
        ctx.font = "110px 'Courier New', monospace"; // 確保量測寬度正確
        const w = ctx.measureText(currentText).width;
        const maxW = 660; // 綠色框內部可用寬度

        if (w <= maxW && !marqueeFinished) {
            marqueeFinished = true;
            marqueeHold = 60;
        }

        if (marqueeFinished) {
            if (marqueeHold > 0) {
                marqueeHold--;
                renderAll();
                return;
            } else {
                if (index === lines.length - 1) {
                    if (isRecording) stopRecordingAndDownload();
                    return;
                }
                slidingOut = true;
                slideOutProgress = 0;
                marqueeFinished = false;
                requestAnimationFrame(slideOutStep);
                return;
            }
        }

        if (marqueeDelay > 0) marqueeDelay--;
        else {
            if (w > maxW) {
                scrollX -= MARQUEE_SPEED;
                if (scrollX < 210 - (w - maxW)) {
                    marqueeFinished = true;
                    marqueeHold = 60;
                }
            }
        }
    }

    renderAll();
}

// 啟動首次渲染
animate();

/* ===== 顯示下一行 ===== */
function showLine() {
    if (index >= lines.length) return;

    currentText = lines[index];
    scrollX = 210; // 重設回螢幕左側起始點

    marqueeDelay = MARQUEE_DELAY;
    marqueeFinished = false;
    marqueeHold = 0;

    slidingIn = true;
    slidingOut = false;
    slideInProgress = 0;
    slideOutProgress = 0;

    if (index === 0) {
        triggerShake();
    }

    requestAnimationFrame(slideInStep);
}

function slideInStep() {
    slideInProgress += SLIDE_SPEED;
    if (slideInProgress >= 1) {
        slidingIn = false;
        slideInProgress = 1;
    } else requestAnimationFrame(slideInStep);
}

function slideOutStep() {
    slideOutProgress += SLIDE_SPEED;
    if (slideOutProgress >= 1) {
        slidingOut = false;
        slideOutProgress = 1;
        index++;
        if (index < lines.length) showLine();
    } else requestAnimationFrame(slideOutStep);
}

/* ===== 🎦 自動錄影與存檔核心 ===== */
function startRecording() {
    if (isRecording) return; 
    recordedChunks = [];
    
    // 擷取整張 1080x1080 畫布，30 FPS
    const stream = canvas.captureStream(30); 
    
    mediaRecorder = new MediaRecorder(stream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 5000000 // 提高至 5 Mbps，確保外觀細節與發光字體極度清晰
    });

    mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) recordedChunks.push(event.data);
    };

    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `bbcall-full-${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
        
        document.getElementById("recIndicator").style.display = "none";
        isRecording = false;
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById("recIndicator").style.display = "block";
}

function stopRecordingAndDownload() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
    }
}

/* ===== 分享鍵與送出邏輯 ===== */
document.getElementById("shareBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    const url = location.href.split("?")[0];
    const shareText = `${url}?msg=${encodeURIComponent(msg)}&clean=1`;
    navigator.clipboard.writeText(shareText);
    alert("已複製分享連結！");
};

// 監聽點擊 Canvas 內部藍色按鈕的位置來觸發分享
canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (W / rect.width);
    const clickY = (e.clientY - rect.top) * (H / rect.height);
    
    // 判斷是否點在 Canvas 的分享鍵範圍內 (X: 680~840, Y: 784~856)
    if (clickX >= 680 && clickX <= 840 && clickY >= 784 && clickY <= 856) {
        document.getElementById("shareBtn").click();
    }
};

document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    
    startRecording();
    showLine();
};

/* 網頁載入時檢查是否 clean=1 */
const params = new URLSearchParams(location.search);
if (params.get("clean") === "1") {
    document.querySelector(".input-area").style.display = "none";

    const urlMsg = params.get("msg");
    if (urlMsg) {
        lines = urlMsg.split("\n");
        index = 0;
        setTimeout(() => {
            startRecording();
            showLine();
        }, 100);
    }
}
</script>

</body>
</html>
