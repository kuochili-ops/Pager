<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call – 恢復版</title>

<style>
body {
    background:#0d0d0d; color:#eee; font-family:"Courier New", monospace;
    display:flex; flex-direction:column; align-items:center; margin:0; padding-top:20px;
}
.input-area { display:flex; gap:10px; margin-bottom:20px; }
textarea {
    width:240px; height:120px; background:#1a1a1a; color:#eee;
    border:1px solid #555; border-radius:6px; padding:10px; resize:none;
}
button { padding:10px 12px; border:none; border-radius:6px; color:#fff; }
#sendBtn { background:#4caf50; }
#recordBtn { background:#ff9800; }
#shareBtn { background:#2196f3; }

.pager {
    width:360px; height:260px; background:#1b1b1b; border-radius:20px;
    padding:14px; box-sizing:border-box; position:relative;
    box-shadow:inset 0 0 10px #000, 0 0 0 3px #444;
}
.screen {
    width:100%; height:60%; background:#021a02; border:3px solid #0f3d0f;
    border-radius:8px; position:relative; overflow:hidden;
}
#screenCanvas { width:100%; height:100%; display:block; image-rendering:pixelated; }

.rec-indicator {
    position:absolute; top:4px; left:8px; color:#ff3b3b; font-size:12px;
    opacity:0; font-weight:bold; text-shadow:0 0 4px #ff3b3b;
}
.rec-on { animation:recBlink 0.8s infinite; }
@keyframes recBlink { 0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;} }

#recordDoneBox {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); padding:20px; border-radius:10px;
    color:#fff; display:none;
}
</style>
</head>

<body>

<div class="input-area">
  <textarea id="msgInput"></textarea>
  <button id="sendBtn">送出</button>
  <button id="recordBtn">錄影</button>
  <button id="shareBtn">分享</button>
</div>

<div class="pager" id="pager">
  <div class="screen">
    <div id="recDot" class="rec-indicator">REC ●</div>
    <canvas id="screenCanvas" width="360" height="140"></canvas>
  </div>
</div>

<div id="recordDoneBox">
  <div>錄影完成！</div>
  <button id="downloadBtn">下載影片</button>
</div>

<script>
/* ===== Canvas 初始化 ===== */
const canvas = document.getElementById("screenCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

ctx.font = "44px Courier New";
ctx.fillStyle = "#b9ffb9";
ctx.textBaseline = "top";
ctx.shadowColor = "#b9ffb9";
ctx.shadowBlur = 6;

/* ===== 原始 BB Call 節奏 ===== */
const HOLD = 60;               // 停留 1 秒
const SLIDE_SPEED = 0.08;      // 原本的滑動速度
const MARQUEE_DELAY = 30;      // 跑馬燈延遲 0.5 秒
const MARQUEE_SPEED = 0.6;

/* ===== 狀態 ===== */
let lines = [];
let index = 0;
let currentText = "";
let scrollX = 10;
let marqueeDelay = 0;

let slidingIn = false;
let slidingOut = false;
let slideProgress = 0;

let backlight = 0;
let backlightFade = 0.015;

/* ===== 主畫面繪製 ===== */
function drawScreen() {
    ctx.clearRect(0,0,W,H);

    let y = 40; // ⭐ 原本的顯示位置（你最早的版本）

    if (slidingIn)  y += (1 - slideProgress) * 40;
    if (slidingOut) y -= slideProgress * 40;

    ctx.fillText(currentText, scrollX, y);

    if (backlight > 0) {
        ctx.fillStyle = `rgba(185,255,185,${backlight * 0.12})`;
        ctx.fillRect(0,0,W,H);
        backlight -= backlightFade;
        if (backlight < 0) backlight = 0;
    }
}

/* ===== 動畫主迴圈 ===== */
function animate() {
    requestAnimationFrame(animate);

    if (!slidingIn && !slidingOut) {
        if (marqueeDelay > 0) marqueeDelay--;
        else {
            const w = ctx.measureText(currentText).width;
            if (w > W - 20) {
                scrollX -= MARQUEE_SPEED;
                if (scrollX < -(w - (W - 20))) scrollX = 10;
            }
        }
    }

    drawScreen();
}
animate();

/* ===== 顯示下一行（恢復版） ===== */
function showLine() {
    if (index >= lines.length) return;

    currentText = lines[index];
    scrollX = 10;

    if (index === 0) backlight = 1;
    marqueeDelay = MARQUEE_DELAY;

    slidingIn = true;
    slidingOut = false;
    slideProgress = 0;

    function slideInStep() {
        slideProgress += SLIDE_SPEED;
        if (slideProgress >= 1) {
            slidingIn = false;
            slideProgress = 1;

            setTimeout(() => {
                slidingOut = true;
                slideProgress = 0;
                requestAnimationFrame(slideOutStep);
            }, HOLD * 16);

        } else requestAnimationFrame(slideInStep);
    }

    function slideOutStep() {
        slideProgress += SLIDE_SPEED;
        if (slideProgress >= 1) {
            slidingOut = false;
            slideProgress = 1;
            index++;
            showLine();
        } else requestAnimationFrame(slideOutStep);
    }

    requestAnimationFrame(slideInStep);
}

/* ===== 錄影 ===== */
let mediaRecorder, recordedChunks = [], isRecording = false;

function startRecording() {
    if (isRecording) return;
    recordedChunks = [];
    const stream = canvas.captureStream(30);
    mediaRecorder = new MediaRecorder(stream, { mimeType:"video/webm" });

    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
    mediaRecorder.onstop = exportVideo;

    mediaRecorder.start();
    isRecording = true;
    document.getElementById("recDot").classList.add("rec-on");
}

function stopRecording() {
    if (!isRecording) return;
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById("recDot").classList.remove("rec-on");
}

function exportVideo() {
    const blob = new Blob(recordedChunks, { type:"video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "bbcall.webm"; a.click();
    document.getElementById("recordDoneBox").style.display = "block";
}

/* ===== 按鈕 ===== */
document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    showLine();
};

document.getElementById("recordBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    startRecording();
    showLine();
};
</script>

</body>
</html>
