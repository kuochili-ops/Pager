<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>BB Call – 自動錄影（手動存檔）版</title>

<style>
body {
    background:#0d0d0d; color:#eee; font-family:"Courier New", monospace;
    display:flex; flex-direction:column; align-items:center; margin:0; padding-top:20px;
}

/* ====== 輸入區 ====== */
.input-area { display:flex; gap:10px; margin-bottom:20px; }
textarea {
    width:240px; height:120px; background:#1a1a1a; color:#eee;
    border:1px solid #555; border-radius:6px; padding:10px; resize:none;
}
button {
    padding:10px 12px; border:none; border-radius:6px;
    color:#fff; background:#4caf50; cursor:pointer;
}
.share-btn { background:#2196f3; }
.record-btn { background:#e91e63; }

/* ====== 機身 ====== */
.pager {
    width:360px; height:300px;
    background:#1b1b1b;
    border-radius:20px;
    padding:14px;
    box-sizing:border-box;
    position:relative;
    box-shadow:
        inset 0 0 10px #000,
        0 0 0 3px #444,
        0 0 20px #000;
    transition:transform 0.1s;
}

/* ====== 正面按鍵 ====== */
.front-buttons {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    display:flex;
    justify-content:space-between;
}

.btn-front {
    width:32px;
    height:32px;
    background:#2a2a2a;
    border-radius:50%;
    box-shadow:0 0 4px #000, inset 0 0 6px #555;
    transition:0.1s;
}
.btn-front:active {
    transform:scale(0.92);
    box-shadow:0 0 2px #000, inset 0 0 3px #777;
}

.share-front {
    width:60px;
    height:32px;
    background:#2196f3;
    border-radius:8px;
    color:white;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 4px #000, inset 0 0 4px #555;
    cursor:pointer;
}

/* ====== 顯示區 ====== */
.screen {
    width:100%;
    height:140px;
    background:#021a02;
    border:3px solid #0f3d0f;
    border-radius:8px;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 0 12px #000;
}

/* ====== 顯示區內狀態列 ====== */
.status-inside {
    position:absolute;
    top:2px;
    left:0;
    width:100%;
    height:20px;
    color:#7aff7a;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    font-weight:bold;
    pointer-events:none;
}

/* ====== 名牌 ====== */
.nameplate {
    position:absolute;
    bottom:-22px;
    left:10px;
    color:#ffffff;
    font-size:14px;
    opacity:0.95;
    text-shadow:0 0 4px #fff;
}

.shell-nameplate {
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    opacity:0.95;
    text-shadow:0 0 4px #fff;
}

#screenCanvas {
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* ====== 震動 ====== */
.pager.shake {
    animation: shake 0.3s ease;
}
@keyframes shake {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(-3px); }
    50%  { transform: translateX(3px); }
    75%  { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="input-area">
  <textarea id="msgInput"></textarea>
  <button id="sendBtn">送出</button>
  <button class="share-btn" id="shareBtn">分享</button>
  <button class="record-btn" id="recordBtn">錄影</button>
</div>

<div class="pager">

  <div class="shell-nameplate">𓃥 白六 CALL</div>

  <div class="screen">

    <div class="status-inside">
        <div>SIG ▂▄▆█</div>
        <div>VIB ≈≈   MSG ✉</div>
        <div>BAT [▮▮▯]</div>
    </div>

    <canvas id="screenCanvas" width="360" height="140"></canvas>

    <div class="nameplate">𓃥 白六 CALL</div>
  </div>

  <div class="front-buttons">
      <div class="btn-front"></div>
      <div class="btn-front"></div>
      <div class="btn-front"></div>
      <div class="btn-front"></div>
      <div class="share-front" id="shareFrontBtn">分享</div>
  </div>

</div>

<script>
/* ===== Canvas 初始化 ===== */
const canvas = document.getElementById("screenCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

ctx.font = "44px Courier New";
ctx.fillStyle = "#b9ffb9";
ctx.textBaseline = "top";
ctx.shadowColor = "#b9ffb9";
ctx.shadowBlur = 6;

/* ===== 動畫節奏 ===== */
const SLIDE_SPEED = 0.08;
const MARQUEE_DELAY = 30;
const MARQUEE_SPEED = 0.6;

/* ===== 狀態 ===== */
let lines = [];
let index = 0;
let currentText = "";
let scrollX = 10;

let marqueeDelay = 0;
let marqueeFinished = false;
let marqueeHold = 0;

let slidingIn = false;
let slidingOut = false;

let slideInProgress = 0;
let slideOutProgress = 0;

/* ===== 主畫面繪製 ===== */
function drawScreen() {
    ctx.clearRect(0,0,W,H);

    let y = 50;

    if (slidingIn) y += (1 - slideInProgress) * 40;
    if (slidingOut) y -= slideOutProgress * 40;

    ctx.fillText(currentText, scrollX, y);
}

/* ===== 動畫主迴圈 ===== */
function animate() {
    requestAnimationFrame(animate);

    if (!slidingIn && !slidingOut && slideInProgress === 1 && slideOutProgress === 0) {

        const w = ctx.measureText(currentText).width;

        if (w <= W - 20 && !marqueeFinished) {
            marqueeFinished = true;
            marqueeHold = 60;
        }

        if (marqueeFinished) {
            if (marqueeHold > 0) {
                marqueeHold--;
                drawScreen();
                return;
            } else {

                if (index === lines.length - 1) {
                    return;
                }

                slidingOut = true;
                slideOutProgress = 0;
                marqueeFinished = false;
                requestAnimationFrame(slideOutStep);
                return;
            }
        }

        if (marqueeDelay > 0) marqueeDelay--;
        else {
            if (w > W - 20) {
                scrollX -= MARQUEE_SPEED;

                if (scrollX < -(w - (W - 20))) {
                    marqueeFinished = true;
                    marqueeHold = 60;
                }
            }
        }
    }

    drawScreen();
}
animate();

/* ===== 顯示下一行 ===== */
function showLine() {
    if (index >= lines.length) return;

    currentText = lines[index];
    scrollX = 10;

    marqueeDelay = MARQUEE_DELAY;
    marqueeFinished = false;
    marqueeHold = 0;

    slidingIn = true;
    slidingOut = false;

    slideInProgress = 0;
    slideOutProgress = 0;

    /* ⭐ 震動只在第一行 */
    if (index === 0) {
        const pager = document.querySelector(".pager");
        pager.classList.add("shake");
        setTimeout(() => pager.classList.remove("shake"), 300);
    }

    requestAnimationFrame(slideInStep);
}

function slideInStep() {
    slideInProgress += SLIDE_SPEED;

    if (slideInProgress >= 1) {
        slidingIn = false;
        slideInProgress = 1;
    } else requestAnimationFrame(slideInStep);
}

function slideOutStep() {
    slideOutProgress += SLIDE_SPEED;

    if (slideOutProgress >= 1) {
        slidingOut = false;
        slideOutProgress = 1;

        index++;

        if (index < lines.length) showLine();
        else stopRecording(); // ⭐ 訊息播完 → 停止錄影（不自動下載）

    } else requestAnimationFrame(slideOutStep);
}

/* ===== 分享鍵 ===== */
function makeShareLink(msg) {
    const url = location.href.split("?")[0];
    return `${url}?msg=${encodeURIComponent(msg)}&clean=1`;
}

document.getElementById("shareBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    navigator.clipboard.writeText(makeShareLink(msg));
    alert("已複製分享連結！");
};

document.getElementById("shareFrontBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    navigator.clipboard.writeText(makeShareLink(msg));
    alert("已複製分享連結！");
};

/* ===== 送出 ===== */
document.getElementById("sendBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) return;
    lines = msg.split("\n");
    index = 0;
    showLine();
};

/* ============================================================
   ⭐ 自動錄影（手動存檔）
   ============================================================ */
let recorder;
let recordedChunks = [];

function startRecording() {
    recordedChunks = [];

    const stream = canvas.captureStream(30);
    recorder = new MediaRecorder(stream, { mimeType: "video/webm" });

    recorder.ondataavailable = e => recordedChunks.push(e.data);

    recorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);

        // ⭐ 顯示手動下載按鈕
        const dlBtn = document.createElement("button");
        dlBtn.textContent = "下載錄影";
        dlBtn.style.marginTop = "10px";
        dlBtn.style.padding = "10px 14px";
        dlBtn.style.background = "#e91e63";
        dlBtn.style.color = "white";
        dlBtn.style.border = "none";
        dlBtn.style.borderRadius = "6px";
        dlBtn.style.cursor = "pointer";

        dlBtn.onclick = () => {
            const a = document.createElement("a");
            a.href = url;
            a.download = "bbcall_message.webm";
            a.click();
        };

        document.body.appendChild(dlBtn);
    };

    recorder.start();
}

function stopRecording() {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }
}

/* ===== 錄影按鈕 ===== */
document.getElementById("recordBtn").onclick = () => {
    const msg = document.getElementById("msgInput").value.trim();
    if (!msg) {
        alert("請先輸入訊息！");
        return;
    }

    // 重置動畫
    lines = msg.split("\n");
    index = 0;

    // ⭐ 開始錄影
    startRecording();

    // ⭐ 開始播放訊息
    showLine();
};

/* ============================================================
   ⭐ clean=1 → 隱藏操作介面 + 自動播放訊息
   ============================================================ */
const params = new URLSearchParams(location.search);
if (params.get("clean") === "1") {
    document.querySelector(".input-area").style.display = "none";
    document.querySelector(".front-buttons").style.display = "none";
    document.getElementById("recordBtn").style.display = "none";

    const urlMsg = params.get("msg");
    if (urlMsg) {
        lines = urlMsg.split("\n");
        index = 0;
        showLine();
    }
}
</script>

</body>
</html>
